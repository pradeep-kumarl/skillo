AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Skillo - Hyperlocal On-the-Go Skill Emergency & Task Dispatch Network

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12
    MemorySize: 256
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  SkilloApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: router.lambda_handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          REQUESTS_TABLE: !Ref RequestsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SkilloUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SkilloRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

Outputs:
  SkilloApiUrl:
    Description: "API Gateway endpoint URL for Skillo backend"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  SkilloFunctionArn:
    Description: "Skillo Lambda Function ARN"
    Value: !GetAtt SkilloApiFunction.Arn